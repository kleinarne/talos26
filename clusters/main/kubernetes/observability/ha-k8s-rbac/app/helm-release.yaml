---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ha-k8s-rbac
  namespace: ha-k8s-rbac
spec:
  interval: 15m
  chart:
    spec:
      chart: homeassistant-kubernetes-rbac
      version: 1.7.0
      sourceRef:
        kind: HelmRepository
        name: tibuntu
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Berlin
    global:
      stopAll: false
    tokenSecret:
      create: true